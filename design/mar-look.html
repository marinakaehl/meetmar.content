<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;600;700&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
:root{--carbon:#10100f;--panel:#1c1c19;--line:#343431;--porc:#f1efea;--muted:#a7a49f;--grey:#96939c;--esp:#2a211d}
body{margin:0;display:flex;gap:30px;background:#1a1a1a;padding:30px;font-family:Geist}
.f{width:360px;height:640px;position:relative;overflow:hidden;border-radius:10px}
.n:after{content:"";position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
.studio{background:radial-gradient(ellipse 75% 50% at 50% 42%,#e4d8c8 0%,#d2c3b0 40%,#b8a691 75%,#9a8774 100%)}
.p{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:250px;height:330px}
.head{position:absolute;left:83px;top:0;width:84px;height:104px;border-radius:50%;background:#c9a58a}
.hair{position:absolute;left:73px;top:-8px;width:104px;height:130px;border-radius:50% 50% 40% 40%;background:#3b2a20}
.body{position:absolute;left:0;top:120px;width:250px;height:230px;border-radius:110px 110px 0 0;background:#4a3326}
.lab{position:absolute;left:16px;top:14px;font:500 10px 'IBM Plex Mono';letter-spacing:.2em;text-transform:uppercase;color:var(--carbon);opacity:.7}
.cap{position:absolute;left:0;right:0;top:455px;text-align:center;font-weight:600;font-size:40px;color:var(--porc);text-shadow:0 2px 16px rgba(16,16,15,.55);letter-spacing:-.01em}
.mono{position:absolute;left:0;right:0;top:455px;text-align:center;font:500 30px 'IBM Plex Mono';letter-spacing:.18em;text-transform:uppercase;color:var(--porc);text-shadow:0 2px 16px rgba(16,16,15,.6)}
.box{position:absolute;left:50%;top:452px;transform:translateX(-50%);background:var(--porc);color:var(--carbon);font:500 22px 'IBM Plex Mono';letter-spacing:.18em;text-transform:uppercase;padding:12px 18px;border-radius:2px;white-space:nowrap}
.hook{position:absolute;left:24px;right:24px;top:70px;font-weight:400;font-size:38px;line-height:1.08;color:var(--carbon);letter-spacing:-.02em}
.hook span{color:#7a6e63}
.bub{position:absolute;left:22px;right:60px;top:300px;background:var(--panel);color:var(--porc);font:400 14px/1.45 Geist;padding:14px 16px;border-radius:2px;border:1px solid var(--line)}
.bub small{display:block;font:400 9px 'IBM Plex Mono';letter-spacing:.2em;color:var(--muted);margin-bottom:6px}
.dark{background:var(--carbon)}
.q{position:absolute;left:28px;right:28px;top:220px;font-weight:300;font-size:36px;line-height:1.15;color:var(--porc);letter-spacing:-.02em}
.q .g{color:var(--grey)}
.cur{display:inline-block;width:3px;height:34px;background:var(--porc);vertical-align:-5px;margin-left:3px}
.end img{mix-blend-mode:lighten;position:absolute;left:0;top:250px;width:360px}
.end .s{position:absolute;left:0;right:0;top:420px;text-align:center;font:400 10px 'IBM Plex Mono';letter-spacing:.25em;color:var(--muted)}
.end .b{position:absolute;left:0;right:0;bottom:40px;text-align:center;font:400 9px 'IBM Plex Mono';letter-spacing:.2em;color:var(--grey)}
</style></head><body>
<div class="f studio n"><div class="lab">Reel 01 · Hook</div>
 <div class="p"><div class="hair"></div><div class="head"></div><div class="body"></div></div>
 <div class="hook">Du gibst MAR dein <span>ganzes</span> Business.</div>
 <div class="cap">Frage.</div></div>
<div class="f studio n"><div class="lab">Reel 01 · Overlay + Akzent</div>
 <div class="p"><div class="hair"></div><div class="head"></div><div class="body"></div></div>
 <div class="bub"><small>MAR</small>Moment. Wie kommst du da drauf?</div>
 <div class="box">Diagnose</div></div>
<div class="f dark n"><div class="lab" style="color:var(--muted)">Reel 02 · 0–8 s</div>
 <div class="q">Wann hast du zuletzt einen Kunden verloren?<br><br><span class="g">Und was war der Grund?</span><span class="cur"></span></div></div>
<div class="f dark n end"><img src="mar-logo.png"><div class="b">LINK IN BIO · BEISPIELFALL</div></div>
</body></html>
